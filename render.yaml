databases:
  - name: rakshagrid-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: rakshagrid-backend
    rootDir: backend
    runtime: node
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rakshagrid-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: rakshagrid-risk-engine
    rootDir: risk-engine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rakshagrid-db
          property: connectionString

  - type: web
    name: rakshagrid-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: rakshagrid-backend
          type: web
          property: host
      - key: VITE_MAPTILER_API_KEY
        sync: false